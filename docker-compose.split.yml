# Phoenix — TRULY SPLIT local stack.
#
# Unlike docker-compose.yml (one process, MODE=all, in-process EventBus), this
# stack runs the API and worker as SEPARATE processes that communicate over a
# shared MariaDB and a Redis EventBus, with a dedicated nginx tier serving the
# SPA. This mirrors the production split deployment (Helm: mode=split).
#
#   docker compose -f docker-compose.split.yml up --build
#   open http://localhost:8080      (login: admin / ChangeMe123!)
#
# Override secrets via a .env file or the shell environment.

name: phoenix-split

services:
  # ── MariaDB — shared system of record for both api and worker ──────────────
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-change_me_root}
      MARIADB_DATABASE: phoenix
      MARIADB_USER: phoenix
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-change_me_app}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redis — cross-process EventBus (REQUIRED in split mode) ────────────────
  # Without it, worker heartbeats never reach the API's WebSocket hub and the
  # dashboard stops updating live (each process would have its own memory bus).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── API tier — HTTP + WebSocket only (MODE=api). Owns DB migrations. ───────
  phoenix-api:
    build:
      context: .
      dockerfile: Dockerfile.split
      target: api
    restart: unless-stopped
    environment:
      DB_ENGINE: mariadb
      DB_DSN: "phoenix:${MARIADB_PASSWORD:-change_me_app}@tcp(mariadb:3306)/phoenix?parseTime=true&loc=UTC&multiStatements=true"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET: ${JWT_SECRET:-change_me_jwt}
      JWT_EXPIRE_HOURS: "168"
      TOTP_ISSUER: Phoenix
      HOST: "0.0.0.0"
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      BOOTSTRAP_USERNAME: ${BOOTSTRAP_USERNAME:-admin}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-ChangeMe123!}
      # Browser WS upgrades arrive via the web tier (:8080); override for real domains.
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-localhost:8080}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Optional direct access for debugging; the browser should use the web tier.
    ports:
      - "3000:3000"

  # ── Migration gate — serializes startup so only the API migrates ───────────
  # The migration runner is NOT concurrency-safe, so the worker must not boot
  # until the API has finished migrating and is serving /api/health/ready.
  api-ready-gate:
    image: busybox:1.36
    restart: "no"
    depends_on:
      phoenix-api:
        condition: service_started
    command:
      - sh
      - -c
      - 'until wget -q -O /dev/null http://phoenix-api:3000/api/health/ready; do echo "waiting for phoenix-api migrations..."; sleep 2; done; echo "phoenix-api ready"'

  # ── Worker tier — scheduler + checkers + notifier (MODE=worker). No HTTP. ──
  phoenix-worker:
    build:
      context: .
      dockerfile: Dockerfile.split
      target: worker
    restart: unless-stopped
    environment:
      DB_ENGINE: mariadb
      DB_DSN: "phoenix:${MARIADB_PASSWORD:-change_me_app}@tcp(mariadb:3306)/phoenix?parseTime=true&loc=UTC&multiStatements=true"
      REDIS_URL: "redis://redis:6379/0"
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    depends_on:
      api-ready-gate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # ── Web tier — nginx serving the SPA, proxying /api + /ws to the API ───────
  phoenix-web:
    build:
      context: .
      dockerfile: Dockerfile.split
      target: web
    restart: unless-stopped
    depends_on:
      phoenix-api:
        condition: service_started
    ports:
      - "8080:80"

volumes:
  mariadb_data:
    driver: local
