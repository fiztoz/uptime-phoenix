# ─── Phoenix Helm values ──────────────────────────────────────────────────────
# Default: minimal-dependency, single pod, zero external services.
# `helm install uptime-phoenix ./charts/uptime-phoenix` just works.

# ── Image ─────────────────────────────────────────────────────────────────────
image:
  repository: ghcr.io/fiztoz/uptime-phoenix
  # Empty uses Chart.AppVersion (the published release). Override to pin a
  # different tag; do not use latest in production — IfNotPresent will not re-pull.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# ── Scaling / Component mode (Phase 3) ────────────────────────────────────────
# all     = single binary, all components (default, Phase 1/2)
# api     = HTTP + WS only (stateless, HPA-scalable) — renders only the API tier
# worker  = scheduler + checkers + notifier only — renders only the worker tier
# split   = TRULY SPLIT: renders BOTH api + worker Deployments in one release.
#           Requires database.engine=mariadb (shared DB) and either
#           redis.enabled=true (external Redis) or valkey.enabled=true
#           (in-release Valkey). The worker waits for the API via an initContainer.
# scaling.mode single/multi kept for backward compat with existing templates
mode: all
scaling:
  mode: single

# Per-mode defaults (used when mode=api or mode=worker)
api:
  enabled: true
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

worker:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # Sharded mode: when WORKER_ID is set, each worker claims its own batch of
  # monitors via DB leases. Set replicas>1 and each pod gets a unique WORKER_ID.
  shards:
    enabled: false
    batchSize: 200
    leaseTTL: 300
    pollEvery: 30

# ── Database (zero external deps default: sqlite on single PVC) ──────────────
# engine: sqlite (default, CGO-free, single pod) | mariadb (opt-in)
# DB_ENGINE and DB_DSN are derived from this.
database:
  engine: sqlite
  # Override DSN if needed (for sqlite: file:/data/phoenix.db ; for mariadb use external or mariadb subchart)
  dsn: ""
  # MariaDB database/sql pool (ignored for sqlite, which is one connection).
  # Per Phoenix process: API and worker each get their own pool.
  pool:
    maxOpenConns: 10
    maxIdleConns: 2
    connMaxIdleSeconds: 30
    connMaxLifetimeSeconds: 300
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""

# ── In-release MariaDB (opt-in; requires database.engine=mariadb) ─────────────
# mariadb.enabled=true deploys a single-replica, PVC-backed MariaDB StatefulSet
# named <release>-mariadb plus its ClusterIP Service, and points the Phoenix DSN
# at it — so `database.engine=mariadb` needs no external server.
#
#   helm install uptime-phoenix ./charts/uptime-phoenix \
#     --set database.engine=mariadb --set mariadb.enabled=true \
#     --set mariadb.persistence.storageClass=longhorn
#
# Use mariadb.enabled=false + mariadbExternal.* for an operator-managed server.
# The two are mutually exclusive and the render fails if both are set.
#
# Ownership: mariadb.enabled=true means THIS release owns the database. If you
# run an api-only release and a worker-only release as two Helm releases, enable
# the in-release MariaDB in exactly ONE of them and point the other at it with
# mariadbExternal.host=<that-release>-mariadb — two releases each running their
# own in-release MariaDB would give the API and the worker two separate
# databases. mode=split keeps both tiers in one release and avoids the question.
mariadb:
  enabled: false
  # Overrides the generated <release>-mariadb resource name. Changing it on an
  # existing release orphans the old PVC and Service — set only on first install.
  fullnameOverride: ""
  image:
    repository: mariadb
    # Empty → "11", the major the embedded migrations are verified against.
    tag: ""
    pullPolicy: IfNotPresent
  # Root (and, unless mariadb.auth.password is set, application) password.
  # Empty generates one, stores it in the release Secret, and reuses it on
  # every `helm upgrade` via `lookup`. This matters more here than for the JWT:
  # mariadb creates its user table only on an EMPTY data directory, so a
  # re-generated password would never reach the running datadir and Phoenix
  # would fail to authenticate. Render-only GitOps controllers (Argo CD
  # `helm template`) have no `lookup` and MUST supply this from a protected
  # values source.
  rootPassword: ""
  # Database + user the image bootstraps on first start, and the credentials
  # the Phoenix DSN uses.
  auth:
    database: phoenix
    username: phoenix
    # Empty reuses rootPassword (one credential, one generated secret).
    password: ""
  service:
    type: ClusterIP
    port: 3306
    annotations: {}
  # Server flags, rendered as container args so the official entrypoint passes
  # them to both mariadb-install-db and mariadbd. character-set-server and
  # collation-server are load-bearing: the MariaDB migrations emit no per-table
  # charset, so the server default is what every table (including the
  # partitioned heartbeats table) actually gets. The server also runs with
  # default-time-zone=+00:00 and skip-name-resolve.
  config:
    characterSet: utf8mb4
    collation: utf8mb4_unicode_ci
    maxConnections: 200
    # "" leaves MariaDB's 128M default. A monitoring database is
    # heartbeat-write-bound, so ~50-70% of the memory limit is the usual tune.
    innodbBufferPoolSize: 256M
    extraArgs: []
  # The Phoenix Pods gate on an authenticated `SELECT 1` against this instance
  # before starting (mariadb-admin ping exits 0 even on access-denied, so it
  # cannot catch a password that drifted from the datadir). attempts * 5s is
  # the budget: first boot provisions the datadir, runs mariadb-install-db and
  # all 34 Phoenix migrations.
  waitFor:
    attempts: 60
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    # Helm owns this claim, so `helm uninstall` would otherwise delete the
    # database along with the release. "keep" adds helm.sh/resource-policy: keep,
    # which makes Helm leave the claim (and its data) behind; delete it by hand
    # once you really mean to drop the history. "delete" restores the destructive
    # default. Any other value fails the render, because a typo here silently
    # changes what an uninstall does to a database.
    resourcePolicy: keep
    annotations: {}
  terminationGracePeriodSeconds: 60
  # Covers ~5 minutes of cold start (datadir init + migrations).
  startupFailureThreshold: 30
  readinessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6
    # A startupProbe suppresses liveness failures during cold start; disable it
    # only if you must support a cluster older than Kubernetes 1.18.
    startupProbeEnabled: true
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # The official mariadb image runs as uid/gid 999 (mysql). fsGroup makes the
  # statically provisioned PVC group-writable; if your storage class ignores
  # fsGroup, pre-chown the volume or set runAsUser/fsGroup to 0 (the image then
  # starts as root and drops privileges itself, as it does in Docker).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
  # readOnlyRootFilesystem stays false: the image writes to /var/log/mysql and
  # /etc/mysql at startup. /run/mysqld and /tmp are already emptyDirs.
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
  networkPolicy:
    # Only used when networkPolicy.enabled=true. Empty allows Pods in this
    # release namespace (the backup/partition/rollup Jobs live there too).
    ingressFrom: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podAnnotations: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  # Required to allow persistence.enabled=false, which stores the datadir in an
  # emptyDir: every monitor, heartbeat and user is lost on each Pod restart.
  allowEphemeralData: false

# ── External MariaDB (when mariadb.enabled=false) ─────────────────────────────
mariadbExternal:
  host: ""
  port: 3306
  database: phoenix
  username: phoenix
  password: ""

# ── JWT signing Secret ────────────────────────────────────────────────────────
# Standard Helm upgrades retain an autogenerated key via lookup. Render-only
# GitOps controllers cannot use lookup, so set either jwt directly through a
# protected values source or reference a stable pre-created Secret.
secret:
  jwt: ""
  existingSecret: ""
  existingSecretKey: jwt-secret

# ── Redis EventBus (opt-in, only needed for multi-pod modes) ───────────────────
redis:
  enabled: false
  # Reference a Secret containing a complete redis:// or rediss:// URL. When
  # set, host/port/password are ignored and the Secret is read directly.
  existingSecret: ""
  existingSecretKey: redis-url
  # Otherwise Phoenix constructs redis://[:password@]host:port/0.
  host: ""
  port: 6379
  password: ""

# ── Valkey subchart (official, opt-in alternative to external Redis) ───────────
# Valkey is Redis-protocol compatible for Phoenix's Pub/Sub EventBus. Enabling
# this deploys Valkey inside the release and automatically wires REDIS_URL.
valkey:
  enabled: false
  nameOverride: ""
  fullnameOverride: ""
  clusterDomain: cluster.local
  image:
    registry: docker.io
    repository: valkey/valkey
    tag: ""
    pullPolicy: IfNotPresent
  auth:
    enabled: true
    # Phoenix creates this Secret by default and retains its generated password
    # across standard Helm upgrades. For GitOps or a pre-created Secret, set
    # managedSecret=false and replace usersExistingSecret with its name. The
    # password key defaults to "default".
    managedSecret: true
    password: ""
    usersExistingSecret: "{{ .Release.Name }}-vk-auth"
    aclUsers:
      default:
        permissions: "~* &* +@all"
        passwordKey: default
  service:
    port: 6379
  # Standalone persistence.
  dataStorage:
    enabled: true
    requestedSize: 1Gi
    className: ""
    accessModes:
      - ReadWriteOnce
  # Optional primary + replicas. The primary Service remains the EventBus
  # endpoint; replica persistence is required when enabled.
  replica:
    enabled: false
    replicas: 2
    persistence:
      size: 1Gi
      storageClass: ""
      accessModes:
        - ReadWriteOnce
  tls:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # Allow Valkey clients from this release namespace only. The named port keeps
  # this policy aligned when valkey.service.port is customized.
  networkPolicy:
    ingress:
      - from:
          - podSelector: {}
        ports:
          - protocol: TCP
            port: tcp

# ── Frontend delivery ─────────────────────────────────────────────────────────
# false = embedded in Go binary (default, zero-dependency)
# true  = separate uptime-phoenix-web Deployment (nginx serving static build)
web:
  split: false
  image:
    repository: ghcr.io/fiztoz/uptime-phoenix-web
    # Empty uses Chart.AppVersion (same rule as image.tag).
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  service:
    type: ClusterIP
    port: 80

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  host: phoenix.example.com
  tls: true
  tlsSecretName: phoenix-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

# ── Cloudflare Tunnel (optional — expose Phoenix without external ingress) ────
# When enabled, the chart runs a `cloudflared` Deployment that dials out to
# Cloudflare and tunnels traffic to the in-cluster uptime-phoenix-api (or uptime-phoenix-web)
# Service. No inbound ports, LoadBalancer, or public Ingress controller needed.
#
# Token model (named tunnel):
#   1. In the Cloudflare Zero Trust dashboard (or `cloudflared tunnel create`),
#      create a NAMED tunnel and a Public Hostname route pointing at the
#      phoenix Service (e.g. http://<release>-api:3000 or <release>:3000).
#   2. Cloudflare gives you a single connector TOKEN. That token encodes the
#      tunnel credentials and config — no certs or config files needed here.
#   3. Provide the token via `cloudflareTunnel.token` (templated into a Secret)
#      OR reference an existing Secret with `existingSecret` + `secretKey`.
#
# When using the tunnel you typically set `ingress.enabled=false`, since
# Cloudflare terminates TLS and routes traffic for you.
cloudflareTunnel:
  enabled: false
  image:
    repository: cloudflare/cloudflared
    tag: "2024.12.2"
    pullPolicy: IfNotPresent
  # 1 is fine; set 2 for HA (Cloudflare load-balances across connectors).
  replicas: 2
  # Tunnel connector token. Provide EITHER an inline token (templated into a
  # Secret by the chart) OR reference an existing Secret you manage yourself.
  #   existingSecret: my-cf-tunnel   # name of a pre-created Secret
  #   secretKey: token               # key within that Secret holding the token
  token: ""
  existingSecret: ""
  secretKey: token
  # Extra flags appended to `cloudflared tunnel run`, e.g.:
  #   - --loglevel
  #   - debug
  extraArgs: []
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── Resource limits ───────────────────────────────────────────────────────────
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

# ── Security context ──────────────────────────────────────────────────────────
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# ── Pod Disruption Budget ─────────────────────────────────────────────────────
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ── Health probes ─────────────────────────────────────────────────────────────
livenessProbe:
  httpGet:
    path: /api/health/live
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# ── Application config (env vars passed to Go binary) ─────────────────────────
config:
  logLevel: info
  logFormat: json
  host: "0.0.0.0"
  port: 3000
  jwtExpireHours: 24
  totpIssuer: "Phoenix"
  # Absolute public origin (https://status.example.com) used in status-page
  # subscription confirmation/unsubscribe links and OIDC post-login redirects.
  # Empty disables email subscriptions and requires OIDC_REDIRECT_URL when SSO is on.
  publicUrl: ""
  # Additional env vars for the Go binary
  env: []

# ── OIDC SSO (Phase 5 Sprint 13) ──────────────────────────────────────────────
# Opt-in. When enabled, operators sign in via the internal IdP. Local password
# + TOTP/passkey login remains available for bootstrap and break-glass recovery.
# Client secret is stored in a Kubernetes Secret — never commit it to values.
oidc:
  enabled: false
  issuer: ""
  clientId: ""
  # clientSecret is templated into the chart Secret when non-empty.
  # Prefer existingSecret for production.
  clientSecret: ""
  existingSecret: ""
  secretKey: oidc-client-secret
  # Absolute callback URL registered with the IdP. Empty derives from
  # config.publicUrl + /api/auth/oidc/callback.
  redirectUrl: ""
  # YAML list or comma-separated string. Both render as OIDC_SCOPES CSV.
  scopes:
    - openid
    - profile
    - email
  groupsClaim: groups
  jitEnabled: true
  linkByEmail: false
  # IdP group names: YAML list or comma-separated string. Empty allowedGroups
  # = any authenticated subject. Same dual form for every *Groups / grantMap field.
  allowedGroups: []
  adminGroups: []
  capNotificationsGroups: []
  capMaintenanceGroups: []
  capCreateMonitorsGroups: []
  capCreateGroupsGroups: []
  capEditGroupMetadataGroups: []
  capViewExtensionsGroups: []
  # Read-only visibility of every monitor/group. Does not grant write.
  capViewAllMonitorsGroups: []
  # idp-group:group:<id> or idp-group:monitor:<id>[,shallow]
  grantMap: []

# ── Bootstrap user (first launch only) ───────────────────────────────────────
# When enabled, the first user is created automatically on startup.
# The password is stored in a Kubernetes Secret — never in values.yaml directly.
# After first login, remove these values and delete the secret for security.
bootstrap:
  enabled: false
  username: admin
  # password is read from an existing Secret via bootstrap.existingSecret,
  # or from bootstrap.password if no existing secret is provided.
  password: ""
  existingSecret: ""

# ── Service ───────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 3000
  annotations: {}

# ── Node selector / tolerations / affinity ─────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}

# ── Horizontal Pod Autoscaler ─────────────────────────────────────────────────
# Off by default. Flip hpa.enabled=true on a horizontally scalable API
# (mode=api|split, or mode=all with scaling.mode=multi + a shared bus).
# CPU uses metrics-server. The WS Pods metric needs prometheus-adapter
# (custom.metrics.k8s.io) and is a second opt-in — do not enable it until
# `kubectl get apiservice | grep custom.metrics` is True.
hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  cpuTargetAverageUtilization: 70
  wsConnections:
    enabled: false
    # Per-pod average for phoenix_ws_connections_active
    averageValue: "200"

# ── NetworkPolicy (optional hardening) ────────────────────────────────────────
networkPolicy:
  enabled: false

# ── Prometheus Operator PodMonitor (optional) ─────────────────────────────────
prometheus:
  # API key for scraping /metrics (stored in Secret when podMonitor enabled)
  apiKey: ""
  podMonitor:
    enabled: false
    interval: 30s
    labels: {}

# ── CronJobs (MariaDB only) ───────────────────────────────────────────────────
cronJobs:
  backup:
    enabled: false
    schedule: "0 2 * * *"
    image: mariadb:11
    username: root
    passwordSecretKey: mariadb-root-password
    database: phoenix
    retentionDays: 14
    persistence:
      enabled: true
      size: 20Gi
      storageClass: ""
  partition:
    enabled: false
    schedule: "0 3 1 * *"
    image: mariadb:11
    username: root
    passwordSecretKey: mariadb-root-password
    database: phoenix
    retentionMonths: 12
  rollup:
    enabled: false
    schedule: "* * * * *"
    image: mariadb:11
    username: root
    passwordSecretKey: mariadb-root-password
    database: phoenix

# ── One-shot DB migration (MariaDB/MySQL → MariaDB) ───────────────────────────
# Pipes a full logical backup from a source instance into a destination
# instance via `mysqldump | mysql`. Use for cut-over migrations, e.g. moving
# onto an in-release MariaDB backed by a Longhorn PVC.
#
# Destination defaults to the in-release MariaDB when mariadb.enabled=true
# (host = <release>-mariadb, password from the release Secret
# mariadb-root-password key). Set mariadb.persistence.storageClass=longhorn to
# back the destination with Longhorn.
#
# Source password MUST come from a pre-created Secret — never hardcode it.
# Create it once: kubectl create secret generic phoenix-src-db \
#   --from-literal=password='...$ourcePwd...'
#
# Runbook:
#   1. kubectl scale deploy/<release> --replicas=0   (stop Phoenix writes)
#   2. helm upgrade <release> ./charts/uptime-phoenix \
#        --set database.engine=mariadb \
#        --set dbMigration.enabled=true \
#        --set dbMigration.source.host=old-mariadb.default.svc \
#        --set dbMigration.source.existingSecret=phoenix-src-db \
#        --set mariadb.enabled=true \
#        --set mariadb.persistence.storageClass=longhorn
#   3. Watch: kubectl logs job/<release>-db-migrate -f
#   4. kubectl scale deploy/<release> --replicas=1   (resume Phoenix)
#   5. On next upgrade, set dbMigration.enabled=false so the Job does not rerun.
dbMigration:
  enabled: false
  image: mariadb:11
  backoffLimit: 0
  resources: {}
  # extraEnv: []   # optional extra env vars on the migrate container
  # Source instance you are migrating FROM.
  source:
    host: ""                 # required
    port: 3306
    username: root
    database: phoenix
    existingSecret: ""       # required: Secret name holding the source password
    passwordKey: password    # key inside that Secret
  # Destination instance you are migrating TO.
  # Defaults to the in-release MariaDB (phoenix.mariadbHost + release Secret
  # mariadb-root-password) when host/existingSecret are empty and
  # mariadb.enabled=true. Override for an external destination.
  destination:
    host: ""                 # empty → uses phoenix.mariadbHost (needs mariadb.enabled=true)
    port: 3306
    username: root
    database: phoenix
    existingSecret: ""       # empty → release Secret
    passwordKey: mariadb-root-password

# ── HTTP hardening / observability (ConfigMap → env) ──────────────────────────
security:
  production: false
  corsAllowOrigins: ""
  rateLimitRPS: 50
  rateLimitBurst: 100

observability:
  otelExporterEndpoint: ""
  otelServiceName: phoenix

# ── Sidebar extensions (optional iframe plugins) ──────────────────────────────
# Default empty: no extra Deployments, catalogue is [].
# Each item is an operator-supplied image. Phoenix does not CREATE USER, does
# not run SQL, and does not mount its own DB_DSN into extension pods.
#
# Example:
# extensions:
#   - id: ecs-usage          # DNS-1123 label, required
#     title: Storage         # sidebar label
#     path: /storage         # Ingress + iframe src; must start with /
#     icon: /storage/icon.svg  # optional; default {path}/icon.svg from the plugin image
#     image: ghcr.io/myteam/ecs-usage:1.2.3
#     pullPolicy: IfNotPresent
#     port: 80
#     replicas: 1
#     readinessPath: /health/ready   # override if the image uses another path
#     resources: {}          # optional
#     env: []                # optional extra env
#     envFromSecret: ""      # optional Secret name, all keys as env
#     uiToken: ""            # optional; single source of truth for the plugin's
#                            # UI_TOKEN: injected into the extension pod AND used
#                            # by Phoenix's gated /api/extensions/:id/frame redirect
#                            # hand-off. Kept in the managed Secret, never in the
#                            # catalog API.
#     database:
#       secretName: ""       # optional; if set, mounted as DATABASE_DSN
#       secretKey: dsn
#
# Paths must not equal or nest under reserved Phoenix routes:
# /api /ws /dashboard /insights /monitors /alerts /notifications
# /escalation-policies /maintenance /status-pages /incidents /backup
# /settings /login /docs /extensions
# Cloudflare Tunnel users must add each path (e.g. /storage) themselves.
extensions: []

# ── Tests ─────────────────────────────────────────────────────────────────────
tests:
  enabled: true
