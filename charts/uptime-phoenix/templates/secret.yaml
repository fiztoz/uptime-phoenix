{{- if and .Values.secret.jwt .Values.secret.existingSecret }}
{{- fail "secret.jwt and secret.existingSecret are mutually exclusive; choose one JWT signing-key source" }}
{{- end }}
{{- $managedJWT := not .Values.secret.existingSecret }}
{{- $managedMariaDB := .Values.mariadb.enabled }}
{{- $managedRedis := and .Values.redis.enabled (not .Values.redis.existingSecret) }}
{{- $managedMetrics := and .Values.prometheus.podMonitor.enabled .Values.prometheus.apiKey }}
{{- $managedOIDC := and .Values.oidc.enabled .Values.oidc.clientSecret (not .Values.oidc.existingSecret) }}
{{/* The Secret is always rendered: it carries the extensions catalogue, which
may embed an extension's UI_TOKEN launch credential (phoenix.extensionsCatalog).
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "phoenix.fullname" . }}
  labels:
    {{- include "phoenix.labels" . | nindent 4 }}
type: Opaque
data:
  extensions-json: {{ include "phoenix.extensionsCatalog" . | b64enc | quote }}
  {{- if $managedJWT }}
  jwt-secret: {{ include "phoenix.jwtSecret" . | b64enc | quote }}
  {{- end }}
  {{- if $managedMariaDB }}
  mariadb-root-password: {{ include "phoenix.dbPassword" . | b64enc | quote }}
  {{- end }}
  {{- if $managedRedis }}
  {{- $redisHost := default "redis-master" .Values.redis.host }}
  {{- $redisPort := int (default 6379 .Values.redis.port) }}
  {{- $redisAuth := "" }}
  {{- if .Values.redis.password }}{{- $redisAuth = printf ":%s@" .Values.redis.password }}{{- end }}
  redis-url: {{ printf "redis://%s%s:%d/0" $redisAuth $redisHost $redisPort | b64enc | quote }}
  {{- end }}
  {{- if $managedMetrics }}
  metrics-api-key: {{ .Values.prometheus.apiKey | b64enc | quote }}
  {{- end }}
  {{- if $managedOIDC }}
  oidc-client-secret: {{ .Values.oidc.clientSecret | b64enc | quote }}
  {{- end }}
