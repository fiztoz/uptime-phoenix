{{- if .Values.web.split }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "phoenix.fullname" . }}-web
  labels:
    {{- include "phoenix.labels" . | nindent 4 }}
    component: web
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "phoenix.selectorLabels" . | nindent 4 }}
    component: web
{{- end }}