{{- if and .Values.hpa.enabled (ne .Values.mode "worker") }}
{{- $target := include "phoenix.deploymentName" . }}
{{- if or (eq .Values.mode "api") (eq .Values.mode "split") }}
{{- $target = printf "%s-api" (include "phoenix.fullname" .) }}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $target }}
  labels:
    {{- include "phoenix.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $target }}
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.cpuTargetAverageUtilization }}
    {{- if and .Values.hpa.wsConnections .Values.hpa.wsConnections.enabled }}
    - type: Pods
      pods:
        metric:
          name: phoenix_ws_connections_active
        target:
          type: AverageValue
          averageValue: {{ .Values.hpa.wsConnections.averageValue | default .Values.hpa.wsConnectionsAverageValue | default "200" | quote }}
    {{- end }}
{{- end }}
