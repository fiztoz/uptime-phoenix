{{- include "phoenix.validateExtensions" . -}}
{{- range .Values.extensions | default list }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "phoenix.extensionName" (dict "root" $ "id" .id) }}
  labels:
    {{- include "phoenix.extensionLabels" (dict "root" $ "id" .id) | nindent 4 }}
spec:
  replicas: {{ .replicas | default 1 | int }}
  selector:
    matchLabels:
      {{- include "phoenix.extensionSelectorLabels" (dict "root" $ "id" .id) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "phoenix.extensionSelectorLabels" (dict "root" $ "id" .id) | nindent 8 }}
      {{- if .uiToken | default "" | toString }}
      annotations:
        {{- /* Issue #67: UI_TOKEN reaches the container as a Secret-backed env,
        so rotating extensions[].uiToken changes neither the Secret reference
        nor the pod spec — the running extension keeps the stale token until
        something restarts it, and new iframe launches then 401. This checksum
        is a fingerprint of the chart-managed token (raw value never appears in
        the annotation) and is scoped to THIS extension only, so `helm upgrade`
        rolls exactly the rotated extension and never its siblings. It is
        deterministic across renders with unchanged values.

        Externally managed Secret-backed env (envFromSecret, database.secretName)
        is deliberately NOT fingerprinted: the chart cannot see those Secret
        contents, so a checksum over their references would never change when
        they do. Supported rotation contract for them: update the referenced
        Secret, then restart this extension
        (kubectl rollout restart deployment/<fullname>-ext-<id>) or touch a
        chart-managed value in the same helm upgrade. */}}
        checksum/ui-token: {{ printf "ext-%s-ui-token=%s" .id (.uiToken | default "" | toString) | sha256sum }}
      {{- end }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .id }}
          image: {{ .image | quote }}
          imagePullPolicy: {{ .pullPolicy | default "IfNotPresent" }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .port | default 80 | int }}
              protocol: TCP
          {{- if .envFromSecret }}
          envFrom:
            - secretRef:
                name: {{ .envFromSecret | quote }}
          {{- end }}
          {{- $db := .database | default dict }}
          {{- if or $db.secretName .env .uiToken }}
          env:
            {{- if .uiToken }}
            # Single source of truth: extensions[].uiToken also lands in the
            # Phoenix catalogue Secret (frame redirect hand-off). secretKeyRef
            # keeps the value out of the pod spec / kubectl describe.
            - name: UI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "phoenix.fullname" $ }}
                  key: {{ printf "ext-%s-ui-token" .id }}
            {{- end }}
            {{- if $db.secretName }}
            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ $db.secretName | quote }}
                  key: {{ $db.secretKey | default "dsn" | quote }}
            {{- end }}
            {{- with .env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .readinessPath | default "/health/ready" | quote }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
