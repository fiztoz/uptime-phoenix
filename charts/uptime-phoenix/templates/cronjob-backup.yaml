{{- if and .Values.cronJobs.backup.enabled (eq (include "phoenix.dbEngine" .) "mariadb") }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "phoenix.fullname" . }}-backup
  labels:
    {{- include "phoenix.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cronJobs.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "phoenix.jobSelectorLabels" (dict "root" . "component" "backup") | nindent 12 }}
            component: backup
        spec:
          restartPolicy: OnFailure
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: mysqldump
              image: {{ .Values.cronJobs.backup.image | quote }}
              imagePullPolicy: IfNotPresent
              env:
                - name: DB_HOST
                  value: {{ include "phoenix.mariadbHost" . | quote }}
                - name: DB_USER
                  value: {{ .Values.cronJobs.backup.username | quote }}
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "phoenix.fullname" . }}
                      key: {{ .Values.cronJobs.backup.passwordSecretKey }}
                - name: DB_NAME
                  value: {{ .Values.cronJobs.backup.database | quote }}
              command:
                - /bin/bash
                - -c
                - |
                  # pipefail matters here: without it `dump | gzip > file` reports
                  # gzip's status, so a failed dump produced an empty backup and a
                  # Complete Job. That is the worst possible outcome for a backup.
                  set -euo pipefail
                  {{- include "phoenix.dbClientResolve" . | nindent 18 }}
                  ts=$(date -u +%Y%m%dT%H%M%SZ)
                  out="/backup/phoenix-${ts}.sql.gz"
                  part="/backup/.phoenix-${ts}.sql.part"
                  mkdir -p /backup
                  # MYSQL_PWD keeps the credential out of the process argv.
                  export MYSQL_PWD="$DB_PASSWORD"
                  "$DB_DUMP" -h "$DB_HOST" -u "$DB_USER" --single-transaction --routines --triggers "$DB_NAME" > "$part"
                  # A dump with no CREATE TABLE means an empty schema, i.e. no backup.
                  grep -q 'CREATE TABLE' "$part" || {
                    echo "ERROR: dump of $DB_NAME contains no tables; refusing to write $out"
                    rm -f "$part"
                    exit 1
                  }
                  gzip -c "$part" > "$out"
                  size=$(wc -c < "$part")
                  gzip -t "$out"
                  rm -f "$part"
                  echo "backup written to $out (${size} bytes of SQL, gzip integrity verified)"
                  find /backup -name 'phoenix-*.sql.gz' -mtime +{{ .Values.cronJobs.backup.retentionDays }} -delete || true
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              {{- if .Values.cronJobs.backup.persistence.enabled }}
              persistentVolumeClaim:
                claimName: {{ include "phoenix.fullname" . }}-backup
              {{- else }}
              emptyDir: {}
              {{- end }}
{{- end }}