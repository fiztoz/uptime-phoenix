{{- if and .Values.valkey.enabled .Values.valkey.auth.enabled .Values.valkey.auth.managedSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "phoenix.valkeyAuthSecretName" . }}
  labels:
    {{- include "phoenix.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
type: Opaque
data:
  {{ include "phoenix.valkeyPasswordKey" . }}: {{ include "phoenix.valkeyPassword" . | b64enc | quote }}
{{- end }}
