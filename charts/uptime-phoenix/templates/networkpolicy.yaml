{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "phoenix.fullname" . }}
  labels:
    {{- include "phoenix.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "phoenix.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 3000
        {{- if .Values.web.split }}
        - protocol: TCP
          port: {{ .Values.web.containerPort }}
        {{- end }}
  egress:
    # Probe runtime (default :8443) and non-443 providers (SMTP 587/465/25,
    # custom webhook ports) are intentionally absent. See
    # docs/multi-region/M6_OPERATOR_REQUIREMENTS.md before enabling probes
    # with this policy — the hub dialer does not use HTTP_PROXY.
    # DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Monitor checks (HTTP/HTTPS)
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    {{- if or .Values.mariadb.enabled .Values.mariadbExternal.host }}
    - ports:
        - protocol: TCP
          port: 3306
    {{- end }}
    {{- if or .Values.redis.enabled .Values.valkey.enabled }}
    - ports:
        - protocol: TCP
          port: {{ include "phoenix.eventBusPort" . }}
    {{- end }}
    {{- if or .Values.cloudflareTunnel.enabled .Values.web.split }}
    # In-release traffic only: cloudflared dials the API and web pods, and the
    # split web tier proxies /api and /ws to the API. Scoped with `to:` to this
    # release's pods so it does not open 3000/8080 to every destination.
    # cloudflared's own egress to Cloudflare's edge is 443 (the HTTP/HTTPS rule
    # above). Policies match the pod port, so web is its containerPort, not the
    # Service port.
    - to:
        - podSelector:
            matchLabels:
              {{- include "phoenix.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 3000
        {{- if .Values.web.split }}
        - protocol: TCP
          port: {{ .Values.web.containerPort }}
        {{- end }}
    {{- end }}
{{- if .Values.cloudflareTunnel.enabled }}
---
# cloudflared reaches Cloudflare's edge on 7844 (QUIC over UDP, or http2 over
# TCP), not 443. Policies are additive, so this one opens 7844 for the
# cloudflared pods alone instead of for every Phoenix pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "phoenix.fullname" . }}-cloudflared
  labels:
    {{- include "phoenix.labels" . | nindent 4 }}
    component: cloudflared
spec:
  podSelector:
    matchLabels:
      {{- include "phoenix.selectorLabels" . | nindent 6 }}
      component: cloudflared
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 7844
        - protocol: TCP
          port: 7844
{{- end }}
{{- end }}
