{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "phoenix.fullname" . }}
  labels:
    {{- include "phoenix.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "phoenix.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Probe runtime (default :8443) and non-443 providers (SMTP 587/465/25,
    # custom webhook ports) are intentionally absent. See
    # docs/multi-region/M6_OPERATOR_REQUIREMENTS.md before enabling probes
    # with this policy — the hub dialer does not use HTTP_PROXY.
    # DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Monitor checks (HTTP/HTTPS). Cloud metadata endpoints are excluded so a
    # monitor cannot read instance credentials even if the app-level guard
    # (OUTBOUND_ALLOWED_CIDRS) is widened (#88).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16
        - ipBlock:
            cidr: ::/0
            except:
              - fd00:ec2::254/128
              - fe80::/10
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    {{- if or .Values.mariadb.enabled .Values.mariadbExternal.host }}
    - ports:
        - protocol: TCP
          port: 3306
    {{- end }}
    {{- if or .Values.redis.enabled .Values.valkey.enabled }}
    - ports:
        - protocol: TCP
          port: {{ include "phoenix.eventBusPort" . }}
    {{- end }}
    {{- if .Values.cloudflareTunnel.enabled }}
    # cloudflared dials phoenix-api/web (3000/80) in-cluster and egresses to
    # Cloudflare's edge over 443 (already allowed by the HTTP/HTTPS rule above).
    - ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 80
    {{- end }}
{{- end }}
