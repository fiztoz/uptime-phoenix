{{- if or (eq .Values.scaling.mode "multi") (eq .Values.mode "api") }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "phoenix.deploymentName" . }}
  labels:
    {{- include "phoenix.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "phoenix.deploymentName" . }}
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.cpuTargetAverageUtilization }}
    - type: Pods
      pods:
        metric:
          name: phoenix_ws_connections_active
        target:
          type: AverageValue
          averageValue: {{ .Values.hpa.wsConnectionsAverageValue | quote }}
{{- end }}