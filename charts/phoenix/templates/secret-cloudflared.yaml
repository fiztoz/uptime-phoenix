{{- if and .Values.cloudflareTunnel.enabled (not .Values.cloudflareTunnel.existingSecret) }}
{{- if not .Values.cloudflareTunnel.token }}
{{- fail "cloudflareTunnel.enabled requires either cloudflareTunnel.token or cloudflareTunnel.existingSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "phoenix.fullname" . }}-cloudflared
  labels:
    {{- include "phoenix.labels" . | nindent 4 }}
    component: cloudflared
type: Opaque
data:
  {{ .Values.cloudflareTunnel.secretKey }}: {{ .Values.cloudflareTunnel.token | b64enc | quote }}
{{- end }}
