{{- if and .Values.bootstrap.enabled (not .Values.bootstrap.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "phoenix.fullname" . }}-bootstrap
  labels:
    {{- include "phoenix.labels" . | nindent 4 }}
type: Opaque
data:
  bootstrap-password: {{ .Values.bootstrap.password | b64enc | quote }}
{{- end }}
