[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
ignoreUntil = 2026-12-15
reason = "deepmerge 4.3.1 has no fixed release. It reaches us only through @sveltejs/vite-plugin-svelte at build time to merge our own Vite/Svelte config; it is not in the shipped static bundle and never merges untrusted input. Remove when a fixed deepmerge or a plugin release without it lands."
