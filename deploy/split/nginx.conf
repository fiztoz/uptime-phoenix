# Phoenix — split-mode web tier (nginx).
#
# Serves the static SvelteKit SPA (adapter-static build) and reverse-proxies
# REST + WebSocket traffic to the phoenix-api service, so the browser only ever
# talks to a single origin (no CORS needed). Mirrors the Vite dev proxy in
# web/vite.config.ts (/api → :3000, /ws → :3000).

upstream phoenix_api {
    server phoenix-api:3000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static asset compression.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ── REST API → phoenix-api ────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://phoenix_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # ── WebSocket → phoenix-api (live heartbeats) ────────────────────────────
    # The API receives worker heartbeats via the Redis EventBus and pushes them
    # to connected clients over this socket.
    location /ws {
        proxy_pass http://phoenix_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    # Unknown paths resolve to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
