# Uptime Phoenix release — dry-run always, publish only from tag-push (bound to that tag).
#
# Triggers:
#   - workflow_dispatch: dry-run by default; may publish the SELECTED artifacts
#     when publish=true AND the git tag v<version> already exists. This is the
#     checkbox UI for fast patch releases (e.g. chart + split images only,
#     skipping the all-in-one image and binaries you will never deploy).
#   - push of tags matching v*: dry-run then publish ALL artifacts for that tag
#     (the full-release path, unchanged).
#
# Integrity rules:
#   - Publish (either trigger) checks out refs/tags/v<version> and asserts
#     HEAD == tag^{commit} before any privileged build/push, so a
#     dispatch-publish is bound to the tagged commit, never an arbitrary branch
#     head. This workflow never creates tags — the maintainer pushes v<version>
#     by hand first.
#   - Version strings are validated (SemVer-compatible) via env, never raw
#     expression interpolation into shell.
#   - External tools (syft) are installed from a versioned release with SHA-256
#     verification — never curl|sh from main.
#
# Publish is further gated by the GitHub Environment named `release` — protect
# it with required reviewers in the repo settings. Dry-run never pushes.
#
# Local equivalent (never publishes):
#   VERSION=0.1.0 ./scripts/release/dry-run.sh

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string without leading v (e.g. 0.1.0 or 0.0.0-snapshot.2)"
        required: true
        type: string
      publish:
        description: "Publish the selected artifacts (needs an existing v<version> tag + release approval). Off = dry-run only."
        required: false
        type: boolean
        default: false
      build_chart:
        description: "Chart: build/publish the Helm chart"
        required: false
        type: boolean
        default: true
      build_split:
        description: "Split images: build/publish api, worker, web"
        required: false
        type: boolean
        default: true
      build_all_in_one:
        description: "All-in-one image: build/publish the single combined image"
        required: false
        type: boolean
        default: false
      build_binaries:
        description: "Binaries: attach cross-compiled binaries to the GitHub Release"
        required: false
        type: boolean
        default: false
      skip_docker:
        description: "Skip Docker image builds in dry-run (faster debug)"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  # Chart values default to ghcr.io/fiztoz/uptime-phoenix; publish uses the current
  # repository owner (lowercased) so forks land under their own GHCR namespace.
  GOTOOLCHAIN: go1.26.6
  # Pin toolchain versions used by this workflow (update deliberately).
  BUN_VERSION: "1.3.14"
  SYFT_VERSION: "1.50.0"
  SYFT_SHA256: "bf7b29ff57f06da30918266a0e1c2885a8f99784798d1bdb1628886aa015d788"
  # SemVer X.Y.Z with optional pre-release/build (no leading v).
  VERSION_REGEX: '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'

jobs:
  dry-run:
    name: dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image_owner: ${{ steps.meta.outputs.image_owner }}
      skip_docker: ${{ steps.meta.outputs.skip_docker }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      publish: ${{ steps.meta.outputs.publish }}
      build_aio: ${{ steps.meta.outputs.build_aio }}
      build_split: ${{ steps.meta.outputs.build_split }}
      build_chart: ${{ steps.meta.outputs.build_chart }}
      build_binaries: ${{ steps.meta.outputs.build_binaries }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve version / flags
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          # Pass dispatch inputs only via env (never ${{ inputs.* }} inside run scripts).
          RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          SKIP_DOCKER_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_docker || false }}
          PUBLISH_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || false }}
          BUILD_CHART_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.build_chart || false }}
          BUILD_SPLIT_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.build_split || false }}
          BUILD_AIO_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.build_all_in_one || false }}
          BUILD_BINARIES_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.build_binaries || false }}
          REPO_OWNER: ${{ github.repository_owner }}
          VERSION_REGEX: ${{ env.VERSION_REGEX }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')"

          to01() { if [ "$1" = "true" ]; then echo 1; else echo 0; fi; }

          if [ "${EVENT_NAME}" = "push" ]; then
            # Tag-push = full release: build and publish every artifact.
            raw="${REF_NAME}"
            version="${raw#v}"
            tag_name="v${version}"
            publish=1
            build_aio=1
            build_split=1
            build_chart=1
            build_binaries=1
            skip_docker=0
            echo "tag_push: full release version=${version} tag=${tag_name} (publish after dry-run if Environment approves)"
          else
            version="${RAW_VERSION#v}"
            if [ -z "${version}" ]; then
              echo "version input is empty" >&2
              exit 2
            fi
            publish="$(to01 "${PUBLISH_INPUT}")"
            build_aio="$(to01 "${BUILD_AIO_INPUT}")"
            build_split="$(to01 "${BUILD_SPLIT_INPUT}")"
            build_chart="$(to01 "${BUILD_CHART_INPUT}")"
            build_binaries="$(to01 "${BUILD_BINARIES_INPUT}")"
            # Dry-run can skip local image builds when no image artifact is
            # selected (or when the debug toggle is set) — the real multi-arch
            # push happens in the publish job.
            if [ "${SKIP_DOCKER_INPUT}" = "true" ] || { [ "${build_aio}" = "0" ] && [ "${build_split}" = "0" ]; }; then
              skip_docker=1
            else
              skip_docker=0
            fi
            if [ "${publish}" = "1" ]; then
              tag_name="v${version}"
              if [ "${build_aio}${build_split}${build_chart}${build_binaries}" = "0000" ]; then
                echo "ERROR: publish=true but no artifact selected (tick at least one of chart / split / all-in-one / binaries)." >&2
                exit 2
              fi
            else
              tag_name=""
            fi
            echo "dispatch: version=${version} publish=${publish} aio=${build_aio} split=${build_split} chart=${build_chart} binaries=${build_binaries} skip_docker=${skip_docker}"
          fi

          if ! printf '%s' "${version}" | grep -Eq "${VERSION_REGEX}"; then
            echo "ERROR: version '${version}' is not SemVer-compatible (expected X.Y.Z or X.Y.Z-prerelease)." >&2
            exit 2
          fi

          {
            echo "image_owner=${owner}"
            echo "version=${version}"
            echo "skip_docker=${skip_docker}"
            echo "tag_name=${tag_name}"
            echo "publish=${publish}"
            echo "build_aio=${build_aio}"
            echo "build_split=${build_split}"
            echo "build_chart=${build_chart}"
            echo "build_binaries=${build_binaries}"
          } >> "${GITHUB_OUTPUT}"

      - name: Bind checkout to release tag (publish only)
        # Any publish path (tag-push OR dispatch publish=true) must build the
        # exact tagged commit, so the artifacts attached to the release match
        # the tag. Pure dry-run (publish=0) keeps the dispatched branch head.
        if: steps.meta.outputs.publish == '1'
        env:
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
            git fetch --force origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}" || true
          fi
          if ! git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
            echo "ERROR: publish requires an existing git tag '${TAG_NAME}'." >&2
            echo "Push the tag by hand first (this workflow never creates tags)." >&2
            exit 1
          fi
          git checkout --force "refs/tags/${TAG_NAME}"
          tag_commit="$(git rev-list -n1 "refs/tags/${TAG_NAME}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "${tag_commit}" != "${head_commit}" ]; then
            echo "ERROR: HEAD (${head_commit}) does not match tag ${TAG_NAME} (${tag_commit})" >&2
            exit 1
          fi
          echo "Bound dry-run to ${TAG_NAME} @ ${head_commit}"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4

      - name: Set up QEMU
        if: steps.meta.outputs.skip_docker != '1'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        if: steps.meta.outputs.skip_docker != '1'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install syft (versioned + checksum; optional SBOM)
        continue-on-error: true
        env:
          SYFT_VERSION: ${{ env.SYFT_VERSION }}
          SYFT_SHA256: ${{ env.SYFT_SHA256 }}
        run: |
          set -euo pipefail
          url="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o /tmp/syft.tgz "${url}"
          echo "${SYFT_SHA256}  /tmp/syft.tgz" | sha256sum -c -
          tar -xzf /tmp/syft.tgz -C /usr/local/bin syft
          syft version

      - name: Build frontend for embed + Docker prebuilt
        run: |
          cd web
          bun install --frozen-lockfile
          bun run build
          test -f dist/index.html

      - name: Release dry-run
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SKIP_DOCKER: ${{ steps.meta.outputs.skip_docker }}
        run: |
          set -euo pipefail
          echo "Running dry-run VERSION=${VERSION} SKIP_DOCKER=${SKIP_DOCKER}"
          ./scripts/release/dry-run.sh
          test -f "dist/release-${VERSION}/INVENTORY.md"

      - name: Upload dry-run artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.meta.outputs.version }}
          path: dist/release-${{ steps.meta.outputs.version }}/
          retention-days: 14
          if-no-files-found: error

  publish:
    name: publish
    # Publishes when publish==1: tag-push (full release) OR a dispatch run with
    # publish=true and an existing v<version> tag (selective fast release).
    # Environment "release" should require reviewers in repo settings.
    needs: dry-run
    if: needs.dry-run.outputs.publish == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.dry-run.outputs.version }}
      IMAGE_OWNER: ${{ needs.dry-run.outputs.image_owner }}
      TAG_NAME: ${{ needs.dry-run.outputs.tag_name }}
      BUILD_AIO: ${{ needs.dry-run.outputs.build_aio }}
      BUILD_SPLIT: ${{ needs.dry-run.outputs.build_split }}
      BUILD_CHART: ${{ needs.dry-run.outputs.build_chart }}
      BUILD_BINARIES: ${{ needs.dry-run.outputs.build_binaries }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Bind publish to existing git tag commit
        env:
          VERSION: ${{ env.VERSION }}
          TAG_NAME: ${{ env.TAG_NAME }}
          VERSION_REGEX: ${{ env.VERSION_REGEX }}
        run: |
          set -euo pipefail
          if [ -z "${TAG_NAME}" ]; then
            TAG_NAME="v${VERSION}"
          fi
          if ! printf '%s' "${VERSION}" | grep -Eq "${VERSION_REGEX}"; then
            echo "ERROR: version '${VERSION}' failed SemVer check" >&2
            exit 2
          fi
          # Ensure the tag object is present, then check out THAT commit only.
          if ! git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
            git fetch --force origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
          fi
          if ! git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
            echo "ERROR: publish requires an existing git tag '${TAG_NAME}'." >&2
            echo "Create and push the tag by hand (this workflow never creates tags)." >&2
            exit 1
          fi
          git checkout --force "refs/tags/${TAG_NAME}"
          tag_commit="$(git rev-list -n1 "refs/tags/${TAG_NAME}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "${tag_commit}" != "${head_commit}" ]; then
            echo "ERROR: HEAD (${head_commit}) does not match tag ${TAG_NAME} (${tag_commit})" >&2
            exit 1
          fi
          echo "Publishing ${TAG_NAME} @ ${head_commit}"

      - name: Download dry-run artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ env.VERSION }}
          path: dist/release-${{ env.VERSION }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4

      - name: Set up QEMU
        if: env.BUILD_AIO == '1' || env.BUILD_SPLIT == '1'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        if: env.BUILD_AIO == '1' || env.BUILD_SPLIT == '1'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR (docker)
        if: env.BUILD_AIO == '1' || env.BUILD_SPLIT == '1'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR (helm OCI)
        if: env.BUILD_CHART == '1'
        env:
          HELM_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "${HELM_REGISTRY_PASSWORD}" | helm registry login ghcr.io \
            -u "${ACTOR}" --password-stdin

      - name: Build frontend for Docker prebuilt
        if: env.BUILD_AIO == '1' || env.BUILD_SPLIT == '1'
        run: |
          set -euo pipefail
          # Subshell keeps cwd at repo root so the web/dist check below is valid
          # after `cd web` (a bare cd left the shell in web/ and failed the test).
          if [ ! -f web/dist/index.html ]; then
            (
              cd web
              bun install --frozen-lockfile
              bun run build
            )
          fi
          test -f web/dist/index.html

      # Keyless Sigstore signing (OIDC). Does not change docker pull for users who
      # skip verification — only adds optional cosign verify for those who want it.
      - name: Install cosign
        if: env.BUILD_AIO == '1' || env.BUILD_SPLIT == '1'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Push multi-arch all-in-one image
        id: push_aio
        if: env.BUILD_AIO == '1'
        env:
          VERSION: ${{ env.VERSION }}
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${IMAGE_OWNER}/uptime-phoenix"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=${VERSION}" \
            --build-arg "USE_PREBUILT_WEB=1" \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            --push \
            --metadata-file /tmp/aio-meta.json \
            -f Dockerfile \
            .
          digest="$(jq -r '."containerimage.digest"' /tmp/aio-meta.json)"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "Pushed ${IMAGE}@${digest}"

      - name: Sign all-in-one image (keyless)
        if: env.BUILD_AIO == '1'
        env:
          IMAGE: ${{ steps.push_aio.outputs.image }}
          DIGEST: ${{ steps.push_aio.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Push and sign multi-arch split images (api, worker, web)
        if: env.BUILD_SPLIT == '1'
        env:
          VERSION: ${{ env.VERSION }}
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
        run: |
          set -euo pipefail
          for target in api worker web; do
            IMAGE="ghcr.io/${IMAGE_OWNER}/uptime-phoenix-${target}"
            echo "==> push ${IMAGE}:${VERSION}"
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --target "${target}" \
              --build-arg "VERSION=${VERSION}" \
              --build-arg "USE_PREBUILT_WEB=1" \
              -t "${IMAGE}:${VERSION}" \
              -t "${IMAGE}:latest" \
              --push \
              --metadata-file "/tmp/split-${target}-meta.json" \
              -f Dockerfile.split \
              .
            digest="$(jq -r '."containerimage.digest"' "/tmp/split-${target}-meta.json")"
            echo "==> cosign sign ${IMAGE}@${digest}"
            cosign sign --yes "${IMAGE}@${digest}"
          done

      - name: Package and push Helm chart to OCI
        if: env.BUILD_CHART == '1'
        env:
          VERSION: ${{ env.VERSION }}
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
        run: |
          set -euo pipefail
          # Prefer the dry-run stamped chart package if present; otherwise re-package.
          CHART_TGZ=""
          if [ -d "dist/release-${VERSION}/charts" ]; then
            for f in "dist/release-${VERSION}/charts"/uptime-phoenix-*.tgz; do
              if [ -f "$f" ]; then
                CHART_TGZ="$f"
                break
              fi
            done
          fi
          if [ -z "${CHART_TGZ}" ]; then
            echo "No chart tgz in dry-run artifact; packaging from charts/uptime-phoenix"
            CHART_SRC="$(mktemp -d)/uptime-phoenix"
            cp -R charts/uptime-phoenix "${CHART_SRC}"
            python3 - "${CHART_SRC}/Chart.yaml" "${VERSION}" <<'PY'
          import pathlib, sys, re
          path = pathlib.Path(sys.argv[1])
          version = sys.argv[2]
          text = path.read_text(encoding="utf-8")
          text2, n = re.subn(r'(?m)^appVersion:\s*.*$', f'appVersion: "{version}"', text, count=1)
          if n != 1:
              raise SystemExit(f"failed to stamp appVersion in {path}")
          path.write_text(text2, encoding="utf-8")
          PY
            mkdir -p "dist/release-${VERSION}/charts"
            helm package "${CHART_SRC}" --destination "dist/release-${VERSION}/charts"
            CHART_TGZ=""
            for f in "dist/release-${VERSION}/charts"/uptime-phoenix-*.tgz; do
              if [ -f "$f" ]; then
                CHART_TGZ="$f"
                break
              fi
            done
          fi
          if [ -z "${CHART_TGZ}" ]; then
            echo "ERROR: no Helm chart package found to push" >&2
            exit 1
          fi
          echo "Pushing ${CHART_TGZ} to oci://ghcr.io/${IMAGE_OWNER}/charts"
          # Helm OCI: package lands as ghcr.io/<owner>/charts/uptime-phoenix:<chartVersion>
          # If OCI push fails (package visibility / naming), images + GitHub Release still matter.
          if ! helm push "${CHART_TGZ}" "oci://ghcr.io/${IMAGE_OWNER}/charts"; then
            echo "WARN: helm OCI push failed — images and GitHub Release will still proceed." >&2
            echo "Inspect chart tgz attached to the GitHub Release." >&2
          fi

      - name: Select release assets
        # Only attach the artifact groups that were selected. INVENTORY.md is
        # always attached; unselected globs match nothing (tolerated below by
        # fail_on_unmatched_files: false).
        env:
          VERSION: ${{ env.VERSION }}
          BUILD_BINARIES: ${{ env.BUILD_BINARIES }}
          BUILD_CHART: ${{ env.BUILD_CHART }}
        run: |
          set -euo pipefail
          rel="dist/release-${VERSION}"
          mkdir -p "${rel}"
          if [ "${BUILD_BINARIES}" != "1" ]; then
            rm -rf "${rel}/binaries"
            echo "binaries not selected — omitting from GitHub Release"
          fi
          if [ "${BUILD_CHART}" != "1" ]; then
            rm -rf "${rel}/charts"
            echo "chart not selected — omitting from GitHub Release"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ env.VERSION }}
          name: Uptime Phoenix v${{ env.VERSION }}
          # Only attaches to an existing tag (checked above). Does not create a
          # new commit on main. If the release already exists, files are updated.
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/release-${{ env.VERSION }}/binaries/*
            dist/release-${{ env.VERSION }}/charts/*
            dist/release-${{ env.VERSION }}/INVENTORY.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
