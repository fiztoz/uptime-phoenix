# Uptime Phoenix release — dry-run always, publish only from tag-push (bound to that tag).
#
# Topology (both phases fan out into parallel jobs):
#
#   prepare
#     ├── ci_gate        (publish only: green CI at the exact tag commit)
#     ├── dry_binaries   (cross-compile + checksums + SBOM)   ┐
#     ├── dry_chart      (helm lint/package/template)         ├─ parallel
#     └── dry_images     (multi-arch buildx, no push)         ┘
#              ↓  (all three must succeed)
#   dry_run  (aggregate: assemble INVENTORY, upload combined release-<version>)
#              ↓  (Environment "release" approval on any publish job)
#     ├── publish_aio    (multi-arch all-in-one image + cosign)   ┐
#     ├── publish_split  (matrix api/worker/web + cosign)         ├─ parallel
#     ├── publish_probe  (multi-arch probe image + cosign)        ┤
#     └── publish_chart  (helm OCI push)                          ┘
#              ↓  (all selected publish jobs must succeed)
#   create_release  (attach binaries/chart/INVENTORY to GitHub Release)
#
# Triggers:
#   - workflow_dispatch: dry-run by default; may publish the SELECTED artifacts
#     when publish=true AND the git tag v<version> already exists. This is the
#     checkbox UI for fast patch releases (e.g. chart + split images only).
#     "Use workflow from" MUST be the tag (v<version>), not main: the `release`
#     environment only allows tags matching v*. GitHub evaluates that policy
#     against github.ref (the dispatched ref), not the tag the job later checks
#     out. Dispatch-from-main fails the publish jobs in ~1s with empty steps.
#   - push of tags matching v*: dry-run then publish ALL artifacts for that tag.
#
# Integrity rules (unchanged — now enforced per parallel job via the
# ./.github/actions/bind-release-ref composite):
#   - Every publish job checks out refs/tags/v<version> and asserts
#     HEAD == tag^{commit} before any privileged build/push. The release source
#     SHA is resolved ONCE in prepare (the `source_sha` pin); every binding job
#     and the CI gate re-resolve the mutable tag and fail closed if it no longer
#     points at that pinned SHA, so moving the tag mid-run can never build or
#     publish a different commit than the one CI verified (issue #56 hardening).
#   - Version strings are validated (SemVer-compatible) via env, never raw
#     expression interpolation into shell.
#   - External tools (syft) are installed from a versioned release with SHA-256
#     verification — never curl|sh from main.
#   - Publish is gated by the GitHub Environment named `release` — protect it
#     with required reviewers. One approval releases every waiting publish job.
#   - Every publish path additionally requires successful CI for the EXACT
#     release commit (ci_gate, issue #56): the tag is resolved to its immutable
#     SHA and every required CI job must have completed successfully for that
#     SHA. Pending, missing, skipped, cancelled, or failed required checks fail
#     CLOSED; green checks on an ancestor or another PR commit cannot satisfy
#     the gate. Enforced on tag-push AND workflow_dispatch publish runs (and on
#     re-runs of either).
#
# Local equivalent (never publishes):
#   VERSION=0.1.0 ./scripts/release/dry-run.sh

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string without leading v (e.g. 0.1.0 or 0.0.0-snapshot.2)"
        required: true
        type: string
      publish:
        description: "Publish the selected artifacts (needs an existing v<version> tag + release approval). Off = dry-run only."
        required: false
        type: boolean
        default: false
      build_chart:
        description: "Chart: build/publish the Helm chart"
        required: false
        type: boolean
        default: true
      build_split:
        description: "Split images: build/publish api, worker, web"
        required: false
        type: boolean
        default: true
      build_all_in_one:
        description: "All-in-one image: build/publish the single combined image"
        required: false
        type: boolean
        default: true
      build_probe:
        description: "Probe image: build/publish the standalone remote probe image"
        required: false
        type: boolean
        default: true
      build_binaries:
        description: "Binaries: attach cross-compiled binaries and operator tools to the GitHub Release"
        required: false
        type: boolean
        default: true
      skip_docker:
        description: "Skip Docker image builds in dry-run (faster debug)"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  # One release run per version/tag; a newer push for the same ref cancels the older.
  group: release-${{ github.workflow }}-${{ github.event.inputs.version || github.ref }}
  cancel-in-progress: false

env:
  # Chart values default to ghcr.io/fiztoz/uptime-phoenix; publish uses the current
  # repository owner (lowercased) so forks land under their own GHCR namespace.
  GOTOOLCHAIN: go1.26.6
  # Pin toolchain versions used by this workflow (update deliberately).
  BUN_VERSION: "1.3.14"
  SYFT_VERSION: "1.50.0"
  SYFT_SHA256: "bf7b29ff57f06da30918266a0e1c2885a8f99784798d1bdb1628886aa015d788"
  # Supported SemVer X.Y.Z with optional hyphenated prerelease (no leading v).
  VERSION_REGEX: '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'

jobs:
  # ── prepare ────────────────────────────────────────────────────────────────
  # Cheap job: resolve version + artifact-selection flags once. No builds here,
  # so the parallel dry-run jobs share one authoritative set of outputs.
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image_owner: ${{ steps.meta.outputs.image_owner }}
      skip_docker: ${{ steps.meta.outputs.skip_docker }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      publish: ${{ steps.meta.outputs.publish }}
      source_sha: ${{ steps.pin.outputs.source_sha }}
      build_aio: ${{ steps.meta.outputs.build_aio }}
      build_split: ${{ steps.meta.outputs.build_split }}
      build_probe: ${{ steps.meta.outputs.build_probe }}
      build_chart: ${{ steps.meta.outputs.build_chart }}
      build_binaries: ${{ steps.meta.outputs.build_binaries }}
    steps:
      - name: Checkout release resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags so the pin step can resolve refs/tags/v<version>
          # locally without persisted credentials.
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve version / flags
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          # Pass dispatch inputs only via env (never ${{ inputs.* }} inside run scripts).
          RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          SKIP_DOCKER_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_docker || false }}
          PUBLISH_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || false }}
          BUILD_CHART_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.build_chart || false }}
          BUILD_SPLIT_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.build_split || false }}
          BUILD_AIO_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.build_all_in_one || false }}
          BUILD_PROBE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.build_probe || false }}
          BUILD_BINARIES_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.build_binaries || false }}
          REPO_OWNER: ${{ github.repository_owner }}
          VERSION_REGEX: ${{ env.VERSION_REGEX }}
        run: |
          set -euo pipefail
          ./scripts/release/resolve-selection.sh
      - name: Pin the immutable release source SHA
        id: pin
        env:
          PUBLISH: ${{ steps.meta.outputs.publish }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
        run: |
          set -euo pipefail
          # Resolve the release source ONCE (issue #56 hardening). On publish
          # runs the source is refs/tags/v<version>; every downstream job
          # re-resolves the tag and fails closed if it no longer points here.
          # Dry-runs keep the dispatched ref, so they pin HEAD (unused by bind).
          if [ "${PUBLISH}" = "1" ]; then
            if ! git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
              echo "ERROR: publish requires an existing git tag '${TAG_NAME}'." >&2
              echo "Push the tag by hand first (this workflow never creates tags)." >&2
              exit 1
            fi
            source_sha="$(git rev-list -n1 "refs/tags/${TAG_NAME}")"
          else
            source_sha="$(git rev-parse HEAD)"
          fi
          echo "Pinned release source SHA: ${source_sha}"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"

  # ── CI gate (publish only) ─────────────────────────────────────────────────
  # Issue #56: publication requires successful CI for the exact release commit.
  # Resolves refs/tags/v<version> to its immutable SHA, then verifies that the
  # CI workflow completed EVERY required job successfully for that SHA. A
  # pending, missing, skipped, cancelled, or failed required check blocks
  # publication (fail closed); green checks on an ancestor or another PR commit
  # do not count. Runs parallel to the dry-run legs; every publish job and
  # create_release depend on this job, so a gate failure skips them all.
  ci_gate:
    name: ci_gate
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
      PUBLISH: ${{ needs.prepare.outputs.publish }}
      EXPECTED_SHA: ${{ needs.prepare.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Bind to release tag commit
        uses: ./.github/actions/bind-release-ref
        with:
          publish: ${{ needs.prepare.outputs.publish }}
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          expected_sha: ${{ needs.prepare.outputs.source_sha }}
      - name: Require successful CI for the exact release commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Fail closed. Dry-runs build artifacts only and are not gated; every
          # publish path (tag-push, dispatch publish=true, re-runs of either)
          # must prove green CI for the exact release commit.
          if [ "${PUBLISH}" != "1" ]; then
            echo "publish != 1 — CI gate not enforced (dry-run)."
            exit 0
          fi
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "ERROR: GITHUB_TOKEN is required to verify CI status (fail closed)." >&2
            exit 1
          fi
          if [ -z "${EXPECTED_SHA:-}" ]; then
            echo "ERROR: EXPECTED_SHA is empty — prepare must pin the release SHA (fail closed)." >&2
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
            echo "ERROR: publish requires an existing git tag '${TAG_NAME}'." >&2
            exit 1
          fi
          # Resolve the tag to an immutable SHA; the gate is SHA-scoped.
          release_sha="$(git rev-list -n1 "refs/tags/${TAG_NAME}")"
          head_sha="$(git rev-parse HEAD)"
          if [ "${release_sha}" != "${head_sha}" ]; then
            echo "ERROR: HEAD (${head_sha}) != tag ${TAG_NAME} (${release_sha})" >&2
            exit 1
          fi
          # The gate is pinned: the tag is mutable, the SHA prepare resolved is
          # not. A tag moved after the run began fails closed here too.
          if [ "${release_sha}" != "${EXPECTED_SHA}" ]; then
            echo "ERROR: tag ${TAG_NAME} now resolves to ${release_sha}, but the release SHA" >&2
            echo "pinned in prepare is ${EXPECTED_SHA} — the tag moved after this run began." >&2
            exit 1
          fi
          echo "Release commit: ${release_sha}"

          # Required jobs of the CI workflow (ci.yml). A required job that is
          # missing, pending, skipped, cancelled, or failed blocks publication.
          required_jobs=(backend frontend e2e mariadb-contract helm docker actionlint)

          api="${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY}/actions"
          runs_json="$(curl -fsS \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/workflows/ci.yml/runs?head_sha=${release_sha}&per_page=100")"

          # Re-check head_sha against the resolved release commit here as well:
          # green runs for an ancestor or another PR commit must never satisfy
          # this gate, regardless of what the API returned.
          run_ids=()
          while IFS= read -r run_id; do
            run_ids+=( "${run_id}" )
          done < <(printf '%s' "${runs_json}" | jq -r --arg sha "${release_sha}" \
            '.workflow_runs[]? | select(.head_sha == $sha and .status == "completed" and .conclusion == "success") | .id')
          if [ "${#run_ids[@]}" -eq 0 ]; then
            echo "ERROR: no completed successful CI workflow run found for release commit ${release_sha}." >&2
            echo "Green checks on an ancestor or another PR commit cannot satisfy this gate." >&2
            echo "Run the CI workflow for this exact commit (push to main or workflow_dispatch on this ref)," >&2
            echo "then re-run this release." >&2
            exit 1
          fi

          satisfied=""
          report=""
          for run_id in ${run_ids[@]+"${run_ids[@]}"}; do
            # Require one successful workflow run, then its latest execution
            # of each job. This permits rerun-failed-jobs (which retains prior
            # successful jobs), but never combines jobs from different runs.
            jobs_json="$(curl -fsS \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/runs/${run_id}/jobs?filter=latest&per_page=100")"
            unmet=""
            for job in "${required_jobs[@]}"; do
              state="$(printf '%s' "${jobs_json}" | jq -r --arg job "${job}" '
                [.jobs[]? | select(.name == $job)] as $m
                | if ($m | length) == 0 then "missing"
                  elif ($m | all(.status == "completed" and .conclusion == "success")) then "success"
                  elif ($m | any(.conclusion == null)) then "pending"
                  else ([$m[] | .conclusion // "pending"] | join(",")) end')"
              if [ "${state}" != "success" ]; then
                unmet="${unmet} ${job}=${state}"
              fi
            done
            if [ -z "${unmet}" ]; then
              echo "CI run ${run_id}: all required jobs succeeded for ${release_sha}."
              satisfied="1"
              break
            fi
            report="${report}CI run ${run_id}:${unmet}"$'\n'
          done
          if [ "${satisfied}" != "1" ]; then
            echo "ERROR: no CI run at release commit ${release_sha} has every required job successful." >&2
            printf '%s' "${report}" >&2
            echo "Pending, missing, skipped, cancelled, or failed required checks block publication (issue #56)." >&2
            exit 1
          fi
          echo "CI gate passed for ${release_sha}."

  # ── dry-run phase (parallel) ────────────────────────────────────────────────
  dry_binaries:
    name: dry-run / binaries
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Bind to release tag (publish only)
        uses: ./.github/actions/bind-release-ref
        with:
          publish: ${{ needs.prepare.outputs.publish }}
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          expected_sha: ${{ needs.prepare.outputs.source_sha }}
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install syft (versioned + checksum; optional SBOM)
        continue-on-error: true
        env:
          SYFT_VERSION: ${{ env.SYFT_VERSION }}
          SYFT_SHA256: ${{ env.SYFT_SHA256 }}
        run: |
          set -euo pipefail
          url="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o /tmp/syft.tgz "${url}"
          echo "${SYFT_SHA256}  /tmp/syft.tgz" | sha256sum -c -
          tar -xzf /tmp/syft.tgz -C /usr/local/bin syft
          syft version
      - name: Build frontend for embed
        run: |
          set -euo pipefail
          cd web
          bun install --frozen-lockfile
          bun run build
          test -f dist/index.html
      - name: Cross-compile binaries + checksums + SBOM
        env:
          VERSION: ${{ env.VERSION }}
          STAGES: binaries,checksums,sbom
        run: |
          set -euo pipefail
          ./scripts/release/dry-run.sh
          test -d "dist/release-${VERSION}/binaries"
      - name: Verify probe/operator release artifacts
        env:
          VERSION: ${{ env.VERSION }}
        run: ./scripts/release/verify-artifacts.sh "${VERSION}" "dist/release-${VERSION}"
      - name: Upload binaries partial
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dry-binaries-${{ env.VERSION }}
          path: dist/release-${{ env.VERSION }}/
          retention-days: 14
          if-no-files-found: error

  dry_chart:
    name: dry-run / chart
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Bind to release tag (publish only)
        uses: ./.github/actions/bind-release-ref
        with:
          publish: ${{ needs.prepare.outputs.publish }}
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          expected_sha: ${{ needs.prepare.outputs.source_sha }}
      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4
      - name: Package Helm chart
        env:
          VERSION: ${{ env.VERSION }}
          STAGES: chart
        run: |
          set -euo pipefail
          ./scripts/release/dry-run.sh
          ls -1 "dist/release-${VERSION}/charts"/uptime-phoenix-*.tgz >/dev/null
      - name: Upload chart partial
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dry-chart-${{ env.VERSION }}
          path: dist/release-${{ env.VERSION }}/
          retention-days: 14
          if-no-files-found: error

  dry_images:
    name: dry-run / images
    needs: prepare
    # Image builds are the slow leg; skip when all three image selections are
    # off (including the standalone probe image).
    if: needs.prepare.outputs.skip_docker != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Bind to release tag (publish only)
        uses: ./.github/actions/bind-release-ref
        with:
          publish: ${{ needs.prepare.outputs.publish }}
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          expected_sha: ${{ needs.prepare.outputs.source_sha }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Install syft (versioned + checksum; optional SBOM)
        continue-on-error: true
        env:
          SYFT_VERSION: ${{ env.SYFT_VERSION }}
          SYFT_SHA256: ${{ env.SYFT_SHA256 }}
        run: |
          set -euo pipefail
          url="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o /tmp/syft.tgz "${url}"
          echo "${SYFT_SHA256}  /tmp/syft.tgz" | sha256sum -c -
          tar -xzf /tmp/syft.tgz -C /usr/local/bin syft
          syft version
      - name: Build frontend for Docker prebuilt
        run: |
          set -euo pipefail
          cd web
          bun install --frozen-lockfile
          bun run build
          test -f dist/index.html
      - name: Docker multi-arch dry-run (no push)
        env:
          VERSION: ${{ env.VERSION }}
          STAGES: images
        run: |
          set -euo pipefail
          ./scripts/release/dry-run.sh
      - name: Upload image proofs partial
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dry-images-${{ env.VERSION }}
          path: dist/release-${{ env.VERSION }}/
          retention-days: 14
          if-no-files-found: warn

  # ── dry-run aggregate / gate ────────────────────────────────────────────────
  # Runs only after every dry-run leg succeeds. Merges the partials, produces the
  # authoritative INVENTORY.md, and re-uploads the combined release-<version>
  # artifact that the publish/create-release jobs consume.
  dry_run:
    name: dry-run
    needs: [prepare, dry_binaries, dry_chart, dry_images]
    # dry_images is skipped when no images were selected — tolerate that, fail
    # on any real failure of the legs.
    if: |
      always() &&
      needs.dry_binaries.result == 'success' &&
      needs.dry_chart.result == 'success' &&
      (needs.dry_images.result == 'success' || needs.dry_images.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ needs.prepare.outputs.version }}
      image_owner: ${{ needs.prepare.outputs.image_owner }}
      tag_name: ${{ needs.prepare.outputs.tag_name }}
      publish: ${{ needs.prepare.outputs.publish }}
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      build_aio: ${{ needs.prepare.outputs.build_aio }}
      build_split: ${{ needs.prepare.outputs.build_split }}
      build_probe: ${{ needs.prepare.outputs.build_probe }}
      build_chart: ${{ needs.prepare.outputs.build_chart }}
      build_binaries: ${{ needs.prepare.outputs.build_binaries }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout (for dry-run.sh inventory stage)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download binaries partial
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dry-binaries-${{ env.VERSION }}
          path: dist/release-${{ env.VERSION }}
      - name: Download chart partial
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dry-chart-${{ env.VERSION }}
          path: dist/release-${{ env.VERSION }}
      - name: Download image proofs partial
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: dry-images-${{ env.VERSION }}
          path: dist/release-${{ env.VERSION }}
      - name: Assemble INVENTORY.md
        env:
          VERSION: ${{ env.VERSION }}
          STAGES: inventory
        run: |
          set -euo pipefail
          ./scripts/release/dry-run.sh
          test -f "dist/release-${VERSION}/INVENTORY.md"
      - name: Upload combined dry-run artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ env.VERSION }}
          path: dist/release-${{ env.VERSION }}/
          retention-days: 14
          if-no-files-found: error

  # ── publish phase (parallel) ────────────────────────────────────────────────
  # Each publish job independently rebinds to the tag commit and pushes one
  # artifact group. The Environment "release" gate applies to every publish job;
  # one approval releases all of them. create_release fans back in at the end.
  publish_aio:
    name: publish / all-in-one
    needs: [dry_run, ci_gate]
    if: needs.dry_run.outputs.publish == '1' && needs.dry_run.outputs.build_aio == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.dry_run.outputs.version }}
      IMAGE_OWNER: ${{ needs.dry_run.outputs.image_owner }}
      TAG_NAME: ${{ needs.dry_run.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Bind to release tag commit
        uses: ./.github/actions/bind-release-ref
        with:
          publish: "1"
          tag_name: ${{ env.TAG_NAME }}
          expected_sha: ${{ needs.dry_run.outputs.source_sha }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build frontend for Docker prebuilt
        run: |
          set -euo pipefail
          if [ ! -f web/dist/index.html ]; then
            (
              cd web
              bun install --frozen-lockfile
              bun run build
            )
          fi
          test -f web/dist/index.html
      - name: Push and sign multi-arch all-in-one image
        env:
          VERSION: ${{ env.VERSION }}
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${IMAGE_OWNER}/uptime-phoenix"
          tags=()
          while IFS= read -r tag; do tags+=( -t "$tag" ); done < <(./scripts/release/image-tags.sh "${IMAGE}" "${VERSION}")
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=${VERSION}" \
            --build-arg "USE_PREBUILT_WEB=1" \
            "${tags[@]}" \
            --push \
            --metadata-file /tmp/aio-meta.json \
            -f Dockerfile \
            .
          digest="$(jq -r '."containerimage.digest"' /tmp/aio-meta.json)"
          echo "Pushed ${IMAGE}@${digest}"
          cosign sign --yes "${IMAGE}@${digest}"

  publish_split:
    name: publish / split-${{ matrix.target }}
    needs: [dry_run, ci_gate]
    if: needs.dry_run.outputs.publish == '1' && needs.dry_run.outputs.build_split == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      # Do not cancel a good push because a sibling failed; each image is independent.
      fail-fast: false
      matrix:
        target: [api, worker, web]
    env:
      VERSION: ${{ needs.dry_run.outputs.version }}
      IMAGE_OWNER: ${{ needs.dry_run.outputs.image_owner }}
      TAG_NAME: ${{ needs.dry_run.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Bind to release tag commit
        uses: ./.github/actions/bind-release-ref
        with:
          publish: "1"
          tag_name: ${{ env.TAG_NAME }}
          expected_sha: ${{ needs.dry_run.outputs.source_sha }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build frontend for Docker prebuilt
        run: |
          set -euo pipefail
          if [ ! -f web/dist/index.html ]; then
            (
              cd web
              bun install --frozen-lockfile
              bun run build
            )
          fi
          test -f web/dist/index.html
      - name: Push and sign multi-arch split image
        env:
          VERSION: ${{ env.VERSION }}
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${IMAGE_OWNER}/uptime-phoenix-${TARGET}"
          tags=()
          while IFS= read -r tag; do tags+=( -t "$tag" ); done < <(./scripts/release/image-tags.sh "${IMAGE}" "${VERSION}")
          echo "==> push ${IMAGE}:${VERSION}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --target "${TARGET}" \
            --build-arg "VERSION=${VERSION}" \
            --build-arg "USE_PREBUILT_WEB=1" \
            "${tags[@]}" \
            --push \
            --metadata-file "/tmp/split-${TARGET}-meta.json" \
            -f Dockerfile.split \
            .
          digest="$(jq -r '."containerimage.digest"' "/tmp/split-${TARGET}-meta.json")"
          echo "==> cosign sign ${IMAGE}@${digest}"
          cosign sign --yes "${IMAGE}@${digest}"

  publish_probe:
    name: publish / probe
    needs: [dry_run, ci_gate]
    if: needs.dry_run.outputs.publish == '1' && needs.dry_run.outputs.build_probe == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.dry_run.outputs.version }}
      IMAGE_OWNER: ${{ needs.dry_run.outputs.image_owner }}
      TAG_NAME: ${{ needs.dry_run.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Bind to release tag commit
        uses: ./.github/actions/bind-release-ref
        with:
          publish: "1"
          tag_name: ${{ env.TAG_NAME }}
          expected_sha: ${{ needs.dry_run.outputs.source_sha }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build, push and sign multi-arch probe image
        env:
          VERSION: ${{ env.VERSION }}
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${IMAGE_OWNER}/uptime-phoenix-probe"
          tags=()
          while IFS= read -r tag; do tags+=( -t "$tag" ); done < <(./scripts/release/image-tags.sh "${IMAGE}" "${VERSION}")
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=${VERSION}" \
            "${tags[@]}" \
            --push \
            --metadata-file /tmp/probe-meta.json \
            -f Dockerfile.probe \
            .
          digest="$(jq -r '."containerimage.digest"' /tmp/probe-meta.json)"
          cosign sign --yes "${IMAGE}@${digest}"

  publish_chart:
    name: publish / chart
    needs: [dry_run, ci_gate]
    if: needs.dry_run.outputs.publish == '1' && needs.dry_run.outputs.build_chart == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.dry_run.outputs.version }}
      IMAGE_OWNER: ${{ needs.dry_run.outputs.image_owner }}
      TAG_NAME: ${{ needs.dry_run.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Bind to release tag commit
        uses: ./.github/actions/bind-release-ref
        with:
          publish: "1"
          tag_name: ${{ env.TAG_NAME }}
          expected_sha: ${{ needs.dry_run.outputs.source_sha }}
      - name: Download combined dry-run artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ env.VERSION }}
          path: dist/release-${{ env.VERSION }}
      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4
      - name: Log in to GHCR (helm OCI)
        env:
          HELM_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "${HELM_REGISTRY_PASSWORD}" | helm registry login ghcr.io \
            -u "${ACTOR}" --password-stdin
      - name: Package and push Helm chart to OCI
        env:
          VERSION: ${{ env.VERSION }}
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
        run: |
          set -euo pipefail
          # Prefer the dry-run stamped chart package if present; otherwise re-package.
          CHART_TGZ="dist/release-${VERSION}/charts/uptime-phoenix-${VERSION}.tgz"
          if [ ! -f "${CHART_TGZ}" ]; then CHART_TGZ=""; fi
          if [ -z "${CHART_TGZ}" ]; then
            echo "No chart tgz in dry-run artifact; packaging from charts/uptime-phoenix"
            CHART_SRC="$(mktemp -d)/uptime-phoenix"
            cp -R charts/uptime-phoenix "${CHART_SRC}"
            python3 - "${CHART_SRC}/Chart.yaml" "${VERSION}" <<'PY'
          import pathlib, sys, re
          path = pathlib.Path(sys.argv[1])
          version = sys.argv[2]
          text = path.read_text(encoding="utf-8")
          text2, vn = re.subn(r'(?m)^version:\s*.*$', f'version: "{version}"', text, count=1)
          text2, an = re.subn(r'(?m)^appVersion:\s*.*$', f'appVersion: "{version}"', text2, count=1)
          if vn != 1 or an != 1:
              raise SystemExit(f"failed to stamp chart version metadata in {path}")
          path.write_text(text2, encoding="utf-8")
          PY
            mkdir -p "dist/release-${VERSION}/charts"
            helm package "${CHART_SRC}" --version "${VERSION}" --app-version "${VERSION}" --destination "dist/release-${VERSION}/charts"
            CHART_TGZ=""
            for f in "dist/release-${VERSION}/charts"/uptime-phoenix-*.tgz; do
              if [ -f "$f" ]; then
                CHART_TGZ="$f"
                break
              fi
            done
          fi
          if [ -z "${CHART_TGZ}" ]; then
            echo "ERROR: no Helm chart package found to push" >&2
            exit 1
          fi
          metadata="$(helm show chart "${CHART_TGZ}")"
          grep -Fx "version: ${VERSION}" <<<"${metadata}" >/dev/null
          grep -Fx "appVersion: ${VERSION}" <<<"${metadata}" >/dev/null
          echo "Pushing ${CHART_TGZ} to oci://ghcr.io/${IMAGE_OWNER}/charts"
          # Helm OCI: package lands as ghcr.io/<owner>/charts/uptime-phoenix:<chartVersion>
          # A selected chart must publish successfully before the release fan-in.
          helm push "${CHART_TGZ}" "oci://ghcr.io/${IMAGE_OWNER}/charts"

  # ── create GitHub Release (fan-in) ──────────────────────────────────────────
  # Attaches binaries/chart/INVENTORY to the tag's Release. Runs only when every
  # SELECTED publish job succeeded (skipped publish jobs are tolerated).
  create_release:
    name: create-release
    needs: [dry_run, ci_gate, publish_aio, publish_split, publish_probe, publish_chart]
    if: |
      always() &&
      needs.ci_gate.result == 'success' &&
      needs.dry_run.result == 'success' &&
      needs.dry_run.outputs.publish == '1' &&
      needs.publish_aio.result != 'failure' && needs.publish_aio.result != 'cancelled' &&
      needs.publish_split.result != 'failure' && needs.publish_split.result != 'cancelled' &&
      needs.publish_probe.result != 'failure' && needs.publish_probe.result != 'cancelled' &&
      needs.publish_chart.result != 'failure' && needs.publish_chart.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.dry_run.outputs.version }}
      TAG_NAME: ${{ needs.dry_run.outputs.tag_name }}
      BUILD_CHART: ${{ needs.dry_run.outputs.build_chart }}
      BUILD_BINARIES: ${{ needs.dry_run.outputs.build_binaries }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Bind to release tag commit
        uses: ./.github/actions/bind-release-ref
        with:
          publish: "1"
          tag_name: ${{ env.TAG_NAME }}
          expected_sha: ${{ needs.dry_run.outputs.source_sha }}
      - name: Download combined dry-run artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ env.VERSION }}
          path: dist/release-${{ env.VERSION }}
      - name: Select release assets
        # Only attach the artifact groups that were selected. INVENTORY.md is
        # always attached; unselected globs match nothing (tolerated below by
        # fail_on_unmatched_files: false).
        env:
          VERSION: ${{ env.VERSION }}
          BUILD_BINARIES: ${{ env.BUILD_BINARIES }}
          BUILD_CHART: ${{ env.BUILD_CHART }}
        run: |
          set -euo pipefail
          rel="dist/release-${VERSION}"
          mkdir -p "${rel}"
          if [ "${BUILD_BINARIES}" != "1" ]; then
            rm -rf "${rel}/binaries"
            echo "binaries not selected — omitting from GitHub Release"
          fi
          if [ "${BUILD_CHART}" != "1" ]; then
            rm -rf "${rel}/charts"
            echo "chart not selected — omitting from GitHub Release"
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ env.VERSION }}
          name: Uptime Phoenix v${{ env.VERSION }}
          # Only attaches to an existing tag (checked above). Does not create a
          # new commit on main. If the release already exists, files are updated.
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/release-${{ env.VERSION }}/binaries/*
            dist/release-${{ env.VERSION }}/charts/*
            dist/release-${{ env.VERSION }}/INVENTORY.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
