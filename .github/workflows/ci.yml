# Uptime Phoenix CI — PR / main gate
#
# Mirrors the local `make gate-full` surface as parallel jobs, plus the MariaDB
# repository contract and Docker image builds that gate-full leaves optional.
# Local `make gate-full` remains the offline/dev gate; CI is the automated one.
#
# Restored 2026-07-28 at owner request (`.github/` was previously removed).

name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # assets.go //go:embed all:web/dist requires at least one file present.
      - name: Ensure web/dist for go:embed
        run: |
          if [ ! -f web/dist/index.html ]; then
            mkdir -p web/dist
            printf '%s\n' '<!doctype html><title>phoenix</title>' > web/dist/index.html
          fi

      - name: Build
        run: go build ./...

      - name: Release and backend harness regressions
        run: make release-image-gate m6-backend-harness-gate

      - name: Vet
        run: go vet ./internal/...

      - name: gofmt
        run: |
          out="$(gofmt -l internal/)"
          if [ -n "$out" ]; then
            echo "gofmt needed on:"
            echo "$out"
            exit 1
          fi

      # The expensive parent repository package runs exactly once across the
      # isolated repository-race matrix (SQLite + MariaDB). All other packages,
      # including repository subpackages and future packages, stay in this gate.
      - name: Test other packages (race)
        shell: bash
        run: |
          set -euo pipefail
          go list ./... > "$RUNNER_TEMP/go-packages"
          mapfile -t packages < <(grep -vx 'github.com/fiztoz/uptime-phoenix/internal/adapters/repository' "$RUNNER_TEMP/go-packages")
          test "${#packages[@]}" -gt 0
          go test -race -count=1 -timeout 40m "${packages[@]}"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # v1.x binaries are built with older Go and refuse to lint go1.25 modules.
          version: v2.15.0
          args: --timeout=10m

      - name: govulncheck
        run: |
          # Pin the scanner version; bump deliberately (Dependabot tracks go.mod, not this pin).
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: osv-scanner
        env:
          OSV_SCANNER_VERSION: v2.7.0
          OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        run: |
          # Release binary checked against a pinned digest; exceptions live in osv-scanner.toml.
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan source --config osv-scanner.toml --lockfile go.mod --lockfile web/bun.lock

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Check, test, build, lint
        working-directory: web
        run: bun run check && bun run test && bun run build && bun run lint

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install frontend deps
        working-directory: web
        run: bun install --frozen-lockfile

      # Warm caches so start-e2e-server.sh can finish inside Playwright's wait.
      - name: Prebuild frontend + Go modules for e2e
        env:
          GOTOOLCHAIN: go1.27.3
        run: |
          go mod download
          (cd web && bun run build)
          test -f web/dist/index.html

      - name: Install Playwright browsers
        working-directory: web
        run: bunx playwright install --with-deps chromium

      - name: Playwright e2e
        working-directory: web
        env:
          CI: true
          GOTOOLCHAIN: go1.27.3
        # start-e2e-server.sh builds web + Go binary and serves on :3100
        run: bun run test:e2e

  repository-race:
    name: repository-race-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    # Each runner owns its database. Never parallelize destructive contracts
    # inside one shared MariaDB instance.
    services:
      mariadb:
        image: mariadb:11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: phoenix_ci
          MYSQL_USER: phoenix
          MYSQL_PASSWORD: phoenix
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      # Dedicated throwaway DB — contract rejects DB name "phoenix" (dev DB).
      TEST_MARIADB_DSN: phoenix:phoenix@tcp(127.0.0.1:3306)/phoenix_ci?parseTime=true&loc=UTC&multiStatements=true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Grant disposable database test privileges
        env:
          MARIADB_CONTAINER: ${{ job.services.mariadb.id }}
          MYSQL_PWD: root
        # PROCESS lets concurrency tests observe held InnoDB lock dependencies.
        # These grants apply only to this job's disposable service database.
        run: |
          docker exec -i -e MYSQL_PWD "$MARIADB_CONTAINER" mariadb -uroot <<'SQL'
          GRANT ALL PRIVILEGES ON `phoenix_migration_%`.* TO 'phoenix'@'%';
          GRANT PROCESS ON *.* TO 'phoenix'@'%';
          SQL

      - name: Complete repository parents (race, both engines)
        run: >-
          python3 -B scripts/repository_test_shards.py run
          --index ${{ matrix.shard }} --count 4 --source-sha "${{ github.sha }}"
          --report "$RUNNER_TEMP/coverage/repository-shard-${{ matrix.shard }}.json"

      # Preserve actual-engine coverage for current AND future subpackages.
      # They also run without a DSN in backend, as before; run once here with it.
      - name: Repository subpackages with real-engine configuration (race)
        if: matrix.shard == 0
        shell: bash
        run: |
          set -euo pipefail
          go list ./internal/adapters/repository/... > "$RUNNER_TEMP/repository-packages"
          mapfile -t packages < <(grep -vx 'github.com/fiztoz/uptime-phoenix/internal/adapters/repository' "$RUNNER_TEMP/repository-packages")
          test "${#packages[@]}" -gt 0
          go test -race -count=1 -timeout 40m "${packages[@]}"

      # Names, timings and provenance only; no raw output, settings or DSNs.
      - name: Upload shard coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/coverage/*.json
          if-no-files-found: error
          retention-days: 7

  # Preserve the required check name. always() makes failed/cancelled/missing
  # matrix work an explicit failure, never a skipped success-shaped aggregate.
  mariadb-contract:
    name: mariadb-contract
    needs: repository-race
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require successful matrix
        env:
          MATRIX_RESULT: ${{ needs.repository-race.result }}
        run: test "$MATRIX_RESULT" = success

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download coverage from every shard
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: repository-shard-*
          path: ${{ runner.temp }}/repository-coverage
          merge-multiple: true

      - name: Verify complete inventory and actual MariaDB leaves
        run: >-
          python3 -B scripts/repository_test_shards.py verify
          --count 4 --source-sha "${{ github.sha }}"
          --reports "$RUNNER_TEMP/repository-coverage"

  helm:
    name: helm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4

      - name: helm lint
        run: helm lint charts/uptime-phoenix

      - name: helm validate (render matrix + in-release MariaDB assertions)
        run: make helm-validate


  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only this job writes: the type=gha build cache needs actions: write.
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Build frontend (USE_PREBUILT_WEB=1)
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
          test -f dist/index.html

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build all-in-one image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: uptime-phoenix:ci
          build-args: |
            USE_PREBUILT_WEB=1
            VERSION=ci
            TARGETOS=linux
            TARGETARCH=amd64
          cache-from: type=gha,scope=uptime-phoenix-aio
          cache-to: type=gha,mode=max,scope=uptime-phoenix-aio

      - name: Build split targets (no push)
        run: |
          for target in api worker web; do
            docker buildx build \
              --platform linux/amd64 \
              --target "$target" \
              --build-arg USE_PREBUILT_WEB=1 \
              --build-arg VERSION=ci \
              --build-arg TARGETOS=linux \
              --build-arg TARGETARCH=amd64 \
              -t "uptime-phoenix-${target}:ci" \
              --load \
              -f Dockerfile.split \
              .
          done

      - name: Smoke-test web image as non-root on a read-only root (#91)
        run: |
          set -euo pipefail
          # nginx resolves the api upstream at startup; point it at loopback.
          docker run -d --name web-smoke \
            --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges \
            --add-host uptime-phoenix-api:127.0.0.1 \
            -p 18080:8080 uptime-phoenix-web:ci
          trap 'docker logs web-smoke || true; docker rm -f web-smoke >/dev/null 2>&1 || true' EXIT
          uid="$(docker exec web-smoke id -u)"
          test "$uid" != "0" || { echo "web image runs as root"; exit 1; }
          for i in $(seq 1 15); do
            if curl -fsS -o /dev/null http://127.0.0.1:18080/; then
              echo "web serves / as uid $uid"
              exit 0
            fi
            sleep 1
          done
          echo "web image did not serve / on 8080"
          exit 1

      - name: Build probe image (no push)
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg VERSION=ci \
            -t uptime-phoenix-probe:ci \
            --load \
            -f Dockerfile.probe \
            .

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download and run actionlint (versioned + checksum)
        env:
          ACTIONLINT_VERSION: "1.7.12"
          # sha256 of actionlint_1.7.12_linux_amd64.tar.gz from the GitHub release checksums file
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --silent --show-error --location -o /tmp/actionlint.tgz "${url}"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C . actionlint
          # Shellcheck style/info findings (SC2129/SC2012/SC2086) are not gate-worthy here.
          ./actionlint -color -shellcheck=
      - name: Every action is pinned to a commit SHA
        run: python3 -B scripts/check-action-pins.py
