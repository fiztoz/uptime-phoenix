# Dependabot version updates for Uptime Phoenix.
# Security alerts/updates are enabled at the repository level; this file only
# schedules version PRs so the dependency graph does not rot silently.
#
# Review each PR: run `make gate-fast` (or wait for CI) before merging.

version: 2
updates:
  # Go modules (backend)
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - go
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      go-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Frontend (Bun uses package.json / bun.lock; Dependabot treats it as npm)
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      frontend-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Majors for vite/svelte/kit/typescript are ignored; bump intentionally
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "svelte"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@sveltejs/kit"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@sveltejs/vite-plugin-svelte"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prettier-plugin-svelte"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used by CI / Release
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      actions:
        patterns: ["*"]

  # Root Dockerfile base images
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(deps)"
      include: scope
    ignore:
      # Stay on Node LTS-class for Docker frontend stage unless intentional
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
