# Air hot-reload config for local API mode (make dev-split-api).
# Env vars are injected by the Makefile; defaults here match docker-compose.deps.yml.
root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/phoenix-api"
  cmd = "CGO_ENABLED=0 go build -trimpath -o ./tmp/phoenix-api ./cmd/api"
  delay = 1000
  exclude_dir = ["web", "charts", "docs", "research", "bin", "tmp", ".git"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go", "sql"]
  kill_delay = "500ms"
  send_interrupt = true
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true

[run]
  args_bin = []