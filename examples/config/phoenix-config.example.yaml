# Phoenix declarative configuration (config-as-code)
# apiVersion: phoenix.dev/v1
#
# Preferred: phoenix-config CLI (admin session JWT or write-scoped API key):
#   export PHOENIX_URL=http://127.0.0.1:3000
#   export PHOENIX_TOKEN=...          # or PHOENIX_API_KEY=phx_...
#   go run ./cmd/phoenix-config validate --file phoenix-config.example.yaml
#   go run ./cmd/phoenix-config plan     --file phoenix-config.example.yaml
#   go run ./cmd/phoenix-config apply    --file phoenix-config.example.yaml --yes
#   go run ./cmd/phoenix-config export   --out phoenix-config.exported.yaml
#   go run ./cmd/phoenix-config plan     --file phoenix-config.example.yaml --prune
#
# Equivalent curl (admin session JWT or write-scoped API key):
#   curl -sS -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/yaml" \
#     --data-binary @phoenix-config.example.yaml \
#     "$PHOENIX_URL/api/config/validate"
#   curl -sS -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/yaml" \
#     --data-binary @phoenix-config.example.yaml \
#     "$PHOENIX_URL/api/config/plan"
#   curl -sS -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/yaml" \
#     --data-binary @phoenix-config.example.yaml \
#     "$PHOENIX_URL/api/config/apply"
#
# Export (secrets redacted to __REDACTED__):
#   curl -sS -H "Authorization: Bearer $TOKEN" "$PHOENIX_URL/api/config/export"
#
# Prune deletes KEYED resources missing from this document only:
#   CLI: --prune on plan/apply. curl: wrap as { document: <this file>, prune: true }.
#
# Secrets: never commit real webhook URLs or passwords. On apply, omit a secret
# field or set it to __REDACTED__ to keep the currently stored value.
# See docs/RUNBOOK.md (config-as-code section) and tests under
# internal/core/services/configascode_test.go.

apiVersion: phoenix.dev/v1
kind: Config
spec:
  tags:
    - key: env-prod
      name: production
      color: "#16a34a"

  notifications:
    - key: slack-ops
      name: Slack Ops
      type: slack
      active: true
      # Default false. Set true to include the public acknowledgement link
      # (Discord: Acknowledge button; other providers: a text link).
      include_ack_url: false
      config:
        # Supply the real URL via a sealed secret overlay in CI, or set once
        # via the UI and leave __REDACTED__ here after export.
        webhook_url: "__REDACTED__"

  monitor_groups:
    - key: core
      name: Core services
      condition: worst_of_children

  monitors:
    - key: api-health
      name: API Health
      type: http
      active: true
      interval: 60
      timeout: 30
      group: core
      config:
        url: https://api.example.com/health
      accepted_statuscodes:
        - "200-299"

  monitor_notifications:
    - monitor: api-health
      notification: slack-ops
      # Default true. Set false to omit the monitor target (URL, host:port,
      # connection string, ...) from this specific monitor's alerts.
      include_target: true

  monitor_tags:
    - monitor: api-health
      tag: env-prod

  status_pages:
    - key: public
      slug: public
      title: Example Status
      published: true
      theme: dark

  status_page_monitors:
    - status_page: public
      monitor: api-health
      display_order: 0
