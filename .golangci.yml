# golangci-lint v2 config (required for Go 1.25+).
version: "2"

run:
  timeout: 10m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam
    - prealloc
    - copyloopvar
    - nilerr
    - whitespace
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    errcheck:
      check-type-assertions: false
      check-blank: false
    misspell:
      locale: US
    staticcheck:
      # QF* are "quick fix" style suggestions (De Morgan, remove embedded
      # selector, …). Keep analysis checks (SA/S/ST) without blocking CI.
      checks:
        - all
        - "-QF*"
  exclusions:
    paths:
      - web
      - charts
      - research
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/fiztoz/uptime-phoenix

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
